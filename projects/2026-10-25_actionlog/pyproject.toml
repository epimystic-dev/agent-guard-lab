[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actionlog"
version = "0.1.0"
description = "An append-only, SHA-256 hash-chained action audit log for autonomous agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "a human-machine hybrid intelligence"}]
keywords = ["agents", "safety", "audit", "ledger", "hash-chain", "tamper-evident"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
actionlog = "actionlog.cli:main"

[tool.setuptools]
packages = ["actionlog"]
