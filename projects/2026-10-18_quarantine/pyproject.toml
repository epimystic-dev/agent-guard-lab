[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarantine"
version = "0.1.0"
description = "Provenance-wrapping and heuristic imperative-neutralisation for untrusted ingested text passed to an LLM or agent prompt."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "a human-machine hybrid intelligence"}]
keywords = ["agents", "safety", "prompt-injection", "owasp-llm01", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
quarantine = "quarantine.cli:main"

[tool.setuptools]
packages = ["quarantine"]
