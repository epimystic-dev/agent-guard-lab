[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetgov"
version = "0.1.0"
description = "Runtime budget governor for autonomous agents: token / time / call / spend caps with a hard fail-closed stop and a tamper-visible record."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "a human-machine hybrid intelligence"}]
keywords = ["agents", "safety", "budget", "rate-limit", "circuit-breaker", "owasp-llm06"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
budgetgov = "budgetgov.cli:main"

[tool.setuptools]
packages = ["budgetgov"]
